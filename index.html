<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Platformer — World 1-1 Inspired</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <button id="openCustomizer" class="hud-btn" aria-controls="customizerPanel" aria-expanded="false">⚙ Open Customizer</button>

  <div id="customizerPanel" class="panel hidden" aria-label="Customizer panel">
    <div class="panel-head">
      <h2>Customizer</h2>
      <button id="closeCustomizer" class="mini-btn" aria-label="Close customizer">✕</button>
    </div>

    <div class="control">
      <label for="gravity">Gravity</label>
      <input id="gravity" type="range" min="0.2" max="2" step="0.1" value="0.9" />
      <span id="gravityValue">0.9</span>
    </div>

    <div class="control">
      <label for="jumpForce">Jump Force</label>
      <input id="jumpForce" type="range" min="8" max="20" step="1" value="14" />
      <span id="jumpValue">14</span>
    </div>

    <div class="control">
      <label for="enemyType">Enemy Type</label>
      <select id="enemyType">
        <option value="goomba">Goomba-style</option>
        <option value="koopa">Koopa-style</option>
        <option value="beetle">Beetle-style</option>
      </select>
    </div>

    <div class="buttons">
      <button id="spawnEnemy">Create Enemy Near Player</button>
      <button id="replaceEnemies">Replace All Enemies</button>
      <button id="randomEvent">Trigger Random Event</button>
      <button id="resetWorld">Reset World</button>
    </div>

    <ul id="eventLog" class="event-log" aria-live="polite"></ul>
    <p class="instructions">Controls: <strong>←/→</strong> move, <strong>Space</strong> jump, <strong>Shift</strong> run, <strong>↓</strong> enter usable pipes.</p>
  </div>

  <main class="stage-wrap">
    <canvas id="game" width="960" height="540" aria-label="Platformer game canvas"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
